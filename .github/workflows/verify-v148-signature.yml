name: Verify v1.4.8 Signature

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download Minisign
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\minisign.zip"
          $dir = "$env:RUNNER_TEMP\minisign"

          Invoke-WebRequest `
            -Uri "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem -Path $dir -Filter "minisign.exe" -Recurse |
            Where-Object { $_.FullName -match "\\x86_64\\minisign\.exe$" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find x86_64 minisign.exe"
          }

          "MINISIGN_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Using Minisign: $($exe.FullName)"

      - name: Find v1.4.8 release assets
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $api = "https://api.github.com/repos/narhmichael190-collab/digital-balance/releases/tags/v1.4.8"

          $release = Invoke-RestMethod `
            -Uri $api `
            -Headers $headers `
            -Method Get

          Write-Host "Assets found:"
          $release.assets | ForEach-Object {
            Write-Host " - $($_.name)"
          }

          $installer = $release.assets |
            Where-Object {
              $_.name -match '1\.4\.8.*x64-setup\.exe$'
            } |
            Select-Object -First 1

          if (-not $installer) {
            throw "Could not find the v1.4.8 x64 NSIS installer."
          }

          $signature = $release.assets |
            Where-Object {
              $_.name -eq "$($installer.name).sig"
            } |
            Select-Object -First 1

          if (-not $signature) {
            throw "Could not find matching signature asset."
          }

          Write-Host ""
          Write-Host "Installer: $($installer.name)"
          Write-Host "Signature: $($signature.name)"

          "INSTALLER_URL=$($installer.browser_download_url)" |
            Out-File $env:GITHUB_ENV -Append

          "SIGNATURE_URL=$($signature.browser_download_url)" |
            Out-File $env:GITHUB_ENV -Append

          "INSTALLER_NAME=$($installer.name)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Download installer and signature
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          Invoke-WebRequest `
            -Uri $env:INSTALLER_URL `
            -Headers $headers `
            -OutFile "$env:RUNNER_TEMP\v148-installer.exe"

          Invoke-WebRequest `
            -Uri $env:SIGNATURE_URL `
            -Headers $headers `
            -OutFile "$env:RUNNER_TEMP\v148-installer.sig"

          Write-Host "Installer downloaded:"
          Get-Item "$env:RUNNER_TEMP\v148-installer.exe" |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "Signature downloaded:"
          Get-Item "$env:RUNNER_TEMP\v148-installer.sig" |
            Select-Object FullName, Length

      - name: Prepare signature
        shell: pwsh
        run: |
          $sigPath = "$env:RUNNER_TEMP\v148-installer.sig"
          $preparedPath = "$env:RUNNER_TEMP\signature.decoded.sig"

          $raw = [System.IO.File]::ReadAllBytes($sigPath)
          $text = [System.Text.Encoding]::UTF8.GetString($raw).Trim()

          try {
            $decoded = [Convert]::FromBase64String(
              ($text -replace '\s','')
            )

            $decodedText = [System.Text.Encoding]::UTF8.GetString($decoded)

            if ($decodedText -match '^untrusted comment:') {
              [System.IO.File]::WriteAllBytes(
                $preparedPath,
                $decoded
              )

              Write-Host "Tauri Base64 wrapper decoded successfully."
            }
            else {
              Copy-Item $sigPath $preparedPath -Force
              Write-Host "Signature was already raw Minisign format."
            }
          }
          catch {
            Copy-Item $sigPath $preparedPath -Force
            Write-Host "Using signature directly."
          }

          Write-Host ""
          Write-Host "Prepared signature:"
          Get-Content $preparedPath

      - name: Verify actual v1.4.8 signature
        shell: pwsh
        run: |
          $publicKey = "RWTKgeWpIbgsfVhofUhPtOX29SabkcMFHWjnHtHe4xAIPRHcQR89uVH5"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "VERIFYING ACTUAL v1.4.8 SIGNATURE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Installer: $env:INSTALLER_NAME"
          Write-Host "Public key ID: 7D2CB821A9E581CA"
          Write-Host "Public key: $publicKey"
          Write-Host ""

          & "$env:MINISIGN_PATH" `
            -Vm "$env:RUNNER_TEMP\v148-installer.exe" `
            -P "$publicKey" `
            -x "$env:RUNNER_TEMP\signature.decoded.sig"

          if ($LASTEXITCODE -ne 0) {
            throw "v1.4.8 signature verification FAILED against OX29."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SUCCESS: v1.4.8 VERIFIED AGAINST OX29"
          Write-Host "========================================"