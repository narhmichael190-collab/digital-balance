name: Release Liba Bilancia

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Create environment file
        shell: pwsh
        run: |
          "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" | Out-File -FilePath .env -Encoding utf8
          "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" | Out-File -FilePath .env -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Liba Bilancia ${{ github.ref_name }}
          releaseBody: Automated Liba Bilancia release.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Install Minisign verifier
        shell: pwsh
        run: |
          $version = "0.12"
          $url = "https://github.com/jedisct1/minisign/releases/download/$version/minisign-$version-win64.zip"
          $zip = "$env:RUNNER_TEMP\minisign.zip"
          $dir = "$env:RUNNER_TEMP\minisign"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem $dir -Recurse -Filter "minisign.exe" |
            Where-Object { $_.FullName -match "\\x86_64\\" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find the x86_64 minisign.exe after extraction."
          }

          Write-Host "Using Minisign: $($exe.FullName)"
          "MINISIGN_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Verify generated updater signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            Where-Object { $_.Name -notlike "*-uninstaller.exe" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find the generated NSIS installer."
          }

          $sig = Get-Item "$($exe.FullName).sig" -ErrorAction SilentlyContinue

          if (-not $sig) {
            throw "Could not find signature file for $($exe.Name)."
          }

          $config = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
          $publicKey = $config.plugins.updater.pubkey

          if (-not $publicKey) {
            throw "Could not find the updater public key in tauri.conf.json."
          }

          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Signature: $($sig.FullName)"

          & $env:MINISIGN_PATH -Vm $exe.FullName `
            -P $publicKey `
            -x $sig.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Minisign verification failed with exit code $LASTEXITCODE."
          }